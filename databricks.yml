bundle:
  name: databricks-learning

resources:
  jobs:
    medallion_pipeline:
      name: raw-to-gold-pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_raw_ingest.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/02_silver_transform.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/03_gold_aggregate.py

targets:
  dev:
    workspace:
      host: https://<your-workspace-url>