resources:
  jobs:
    sales_orders_medallion_pipeline:
      name: sales-orders-medallion-pipeline
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/01_raw_ingest
            source: WORKSPACE
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_silver_transform
            source: WORKSPACE
        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_gold_aggregate
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED